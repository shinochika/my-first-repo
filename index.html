<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 - テスト太郎</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            padding: 2.5rem 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            margin: 0 0 1.5rem;
            color: #333;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 0.5rem;
        }
        dl {
            margin: 0;
        }
        dt {
            font-weight: bold;
            color: #4a90e2;
            margin-top: 1rem;
        }
        dd {
            margin: 0.25rem 0 0;
            color: #555;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>自己紹介</h1>
        <dl>
            <dt>名前</dt>
            <dd>テスト太郎</dd>
            <dt>職業</dt>
            <dd>エンジニア</dd>
            <dt>所属</dt>
            <dd>グケン㈱</dd>
        </dl>
    </div>
</body>
</html>
